<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aprozar Românesc</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<style>
:root{--g:#1b5e20;--g2:#2e7d32;--gl:#e8f5e9;--ink:#1c2430;--mut:#6b7280;--bg:#f7f7f5;--card:#fff;--red:#d92643;--yel:#f5c400;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:70px;}
.wrap{max-width:480px;margin:0 auto;padding:10px 12px;}
@media(min-width:500px){.wrap{box-shadow:0 0 24px rgba(0,0,0,.10);min-height:100vh;background:#fcfcfa;}}
header{display:flex;align-items:center;gap:10px;padding:6px 0;}
header .logo{font-weight:900;color:var(--g);font-size:1.1rem;white-space:nowrap;}
header .logoimg{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#fff;}
.searchbox{position:relative;flex:1;}
.searchbox input{width:100%;padding:10px 12px;border-radius:12px;border:1px solid #ddd;font-size:.9rem;}
.sugg{position:absolute;top:44px;left:0;right:0;background:#fff;border:1px solid #ddd;border-radius:12px;z-index:30;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.12);}
.sugg div{padding:9px 12px;font-size:.85rem;cursor:pointer;border-bottom:1px solid #f0f0f0;}
.sugg div:hover{background:var(--gl);}
.adbar{position:relative;border-radius:14px;color:#fff;padding:12px 14px;margin:8px 0;background:linear-gradient(90deg,#26160f,#4e342e 30%,#3e2723 60%,#26160f);overflow:hidden;}
.adbar .badge{position:absolute;top:8px;right:8px;background:var(--red);color:#fff;font-size:.6rem;font-weight:800;padding:3px 8px;border-radius:6px;letter-spacing:1px;}
.adbar h3{font-style:italic;font-size:1.05rem;}
.adbar p{font-size:.72rem;opacity:.9;margin:2px 0 8px;}
.adbar .btns{display:flex;gap:8px;flex-wrap:wrap;}
.btn{border:none;border-radius:999px;padding:9px 14px;font-weight:700;font-size:.78rem;cursor:pointer;}
.btn.y{background:var(--yel);color:#1a1a1a;}
.btn.g{background:var(--g2);color:#fff;}
.btn.o{background:#fff;color:var(--g);border:1px solid var(--g);}
.cats{display:flex;gap:8px;overflow-x:auto;padding:6px 0;scrollbar-width:none;}
.cats span{flex:0 0 auto;background:#fff;border:1px solid #ddd;border-radius:999px;padding:7px 13px;font-size:.78rem;cursor:pointer;}
.cats span.on{background:var(--g);color:#fff;border-color:var(--g);}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding:6px 0 10px;scroll-snap-type:x mandatory;}
.hscroll::-webkit-scrollbar{display:none;}
.pcard{flex:0 0 210px;scroll-snap-align:start;background:#fff;border:1px solid #e5e5e5;border-radius:14px;overflow:hidden;position:relative;cursor:pointer;}
.pcard .cover{height:110px;display:flex;align-items:center;justify-content:center;font-size:52px;}
.pcard .pav{position:absolute;top:92px;left:12px;width:44px;height:44px;border-radius:50%;background:#fff;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 2px 6px rgba(0,0,0,.2);}
.pcard .body{padding:26px 12px 12px;}
.pcard h4{font-size:.88rem;}
.pcard .meta{font-size:.7rem;color:var(--mut);margin:2px 0;}
.stars{color:#f5a623;font-size:.7rem;}
.heart{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.9);border:none;border-radius:50%;width:30px;height:30px;font-size:.9rem;cursor:pointer;z-index:5;}
.anunt{background:#fff8e1;border:1px solid #ffe082;border-radius:10px;padding:7px 10px;font-size:.75rem;margin:6px 0;}
.prodrow{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:10px;margin:8px 0;position:relative;}
.prodrow .img{width:52px;height:52px;border-radius:10px;background:var(--gl);display:flex;align-items:center;justify-content:center;font-size:28px;flex:0 0 auto;}
.prodrow .info{flex:1;min-width:0;}
.prodrow .info b{font-size:.85rem;display:block;}
.prodrow .info small{color:var(--mut);font-size:.7rem;}
.prodrow .right{text-align:right;}
.prodrow .price{font-weight:800;font-size:.85rem;}
.qty{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:4px;}
.qty button{width:26px;height:26px;border-radius:50%;border:1px solid #ccc;background:#fff;cursor:pointer;font-weight:800;}
.season{position:absolute;top:-6px;left:10px;background:var(--g2);color:#fff;font-size:.6rem;padding:2px 8px;border-radius:999px;}
.sticky-total{position:sticky;top:0;z-index:40;background:var(--g);color:#fff;border-radius:0 0 14px 14px;padding:8px 14px;display:flex;justify-content:space-between;font-size:.85rem;font-weight:700;cursor:pointer;}
h2.sec{font-size:.95rem;margin:14px 0 6px;display:flex;justify-content:space-between;align-items:center;}
h2.sec a{font-size:.72rem;color:var(--g2);cursor:pointer;}
.story{flex:0 0 240px;background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:12px;scroll-snap-align:start;cursor:pointer;}
.story b{font-size:.82rem;color:var(--g);}
.story small{color:var(--mut);font-size:.7rem;}
nav.bottom{position:fixed;bottom:0;left:0;right:0;margin:0 auto;max-width:480px;background:var(--g);display:flex;z-index:50;}
nav.bottom a{flex:1;text-align:center;color:#c8e6c9;font-size:.62rem;padding:8px 0;cursor:pointer;}
nav.bottom a.on{color:#fff;font-weight:700;}
nav.bottom a span{display:block;font-size:1.1rem;}
.card{background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:14px;margin:10px 0;}
.cover-big{height:150px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:64px;}
.av-big{width:74px;height:74px;border-radius:50%;background:#fff;border:4px solid #fff;margin-top:-38px;margin-left:14px;display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 2px 8px rgba(0,0,0,.25);}
.rev{background:var(--gl);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:.78rem;}
.rev .rep{background:#fff;border-left:3px solid var(--g2);margin-top:6px;padding:6px 8px;border-radius:6px;font-size:.72rem;}
.hist{background:#fff;border:1px solid #e5e5e5;border-radius:12px;margin:8px 0;overflow:hidden;}
.hist .row{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;}
.hist .date{flex:1;font-size:.8rem;font-weight:700;}
.hist .sum{font-weight:800;color:var(--g);font-size:.85rem;}
.hist .det{border-top:1px dashed #ddd;padding:10px 12px;font-size:.78rem;background:#fafafa;}
.field{margin:8px 0;}
.field label{font-size:.7rem;color:var(--mut);display:block;margin-bottom:3px;}
.field input,.field select,.field textarea{width:100%;padding:9px;border:1px solid #ddd;border-radius:10px;font-size:.85rem;}
.empty{color:var(--mut);text-align:center;padding:16px;font-size:.8rem;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="bottom" id="nav"></nav>
<script>
/* ---------- DATE DEMO ---------- */
const CATS=['Fructe','Legume','Cartofi și ceapă','Lactate','Cereale','Panificație','Miere și dulciuri','Dulcețuri','Carne și ouă','Pește','Conserve și murături','Băuturi naturale','Plante și ceaiuri','Altele'];
const PRODUCERS=[
 {id:'p1',name:'Grădina lui Nelu',loc:'Săcueni, Bihor',km:2.1,rating:4.9,rev:87,verified:true,cover:'linear-gradient(135deg,#2e7d32,#81c784)',av:'👨🌾',anunt:''},
 {id:'p2',name:'Legume de la Mama',loc:'Vultureni, Cluj',km:3.4,rating:4.8,rev:64,verified:true,cover:'linear-gradient(135deg,#33691e,#aed581)',av:'👩‍🌾',anunt:'🌞 Reducere 10% la roșii până vineri!'},
 {id:'p3',name:'Ferma Dâmbovița',loc:'Găești, Dâmbovița',km:4.8,rating:4.7,rev:53,verified:true,cover:'linear-gradient(135deg,#4e342e,#a1887f)',av:'🧑‍🌾',anunt:''},
 {id:'p4',name:'Livada Moise',loc:'Odobești, Vrancea',km:6.2,rating:4.8,rev:41,verified:true,cover:'linear-gradient(135deg,#1b5e20,#a5d6a7)',av:'👩‍',anunt:'🚗 Plecat din localitate până marți.'},
 {id:'p5',name:'Stupina Vasile',loc:'Fetești, Ialomița',km:7.5,rating:4.9,rev:38,verified:true,cover:'linear-gradient(135deg,#e65100,#ffcc80)',av:'👨‍',anunt:'🏖️ În concediu 10–20 ale lunii.'}
];
const PRODUCTS=[
 {id:'rosii',p:'p1',name:'Roșii Inimă de Bou',price:12.5,unit:'kg',cat:'Legume',img:'🍅',season:true,desc:'Soi țărănesc inimă de bou, cules copt.'},
 {id:'capsuni',p:'p1',name:'Căpșuni',price:18,unit:'kg',cat:'Fructe',img:'🍓',season:true,desc:'Rânduri mici, fără forțaj.'},
 {id:'cas',p:'p3',name:'Caș afumat',price:28,unit:'kg',cat:'Lactate',img:'🧀',season:false,desc:'Afumat lent, rețetă de familie.'},
 {id:'cartofi',p:'p2',name:'Cartofi roșii',price:7.6,unit:'kg',cat:'Cartofi și ceapă',img:'🥔',season:false,desc:'Copți în sol nisipos.'},
 {id:'morcovi',p:'p2',name:'Morcovi',price:4.2,unit:'kg',cat:'Legume',img:'🥕',season:false,desc:'Dulci, buni și cruzi.'},
 {id:'mere',p:'p4',name:'Mere de deal',price:6.5,unit:'kg',cat:'Fructe',img:'🍎',season:true,desc:'Din livada de pe deal.'},
 {id:'prune',p:'p4',name:'Prune',price:8,unit:'kg',cat:'Fructe',img:'🍑',season:true,desc:'Bune și pentru țuică.'},
 {id:'miere',p:'p5',name:'Miere de tei',price:45,unit:'kg',cat:'Miere și dulciuri',img:'🍯',season:false,desc:'Cules la Fetești.'},
 {id:'oua',p:'p3',name:'Ouă de găină',price:1.4,unit:'buc',cat:'Carne și ouă',img:'🥚',season:false,desc:'De la găini crescute în curte.'},
 {id:'paine',p:'p2',name:'Pâine pe vatră',price:9,unit:'buc',cat:'Panificație',img:'🍞',season:false,desc:'Frământată manual.'}
];
const STORIES=[
 {p:'p3',t:'Povestea lui Marin',txt:'De la 3 vaci la o fermă respectată.'},
 {p:'p1',t:'Roșiile Inimă de Bou ale lui Nelu',txt:'Secretul: pământ viu, fără grabă.'},
 {p:'p2',t:'Masa Ioanei',txt:'Legume care chiar au gust.'},
 {p:'p4',t:'Merele de pe deal',txt:'O livadă sădită în 1998.'},
 {p:'p5',t:'Teiul din Fetești',txt:'Mierea care se cristalează firesc.'}
];
const STORES=[
 {name:'Dor de Casă Gherla',loc:'Gherla',km:1.2},
 {name:'Dor de Casă Dej',loc:'Dej',km:18},
 {name:'Dor de Casă Cluj',loc:'Cluj-Napoca',km:38},
 {name:'Dor de Casă Bistrița',loc:'Bistrița',km:55},
 {name:'Dor de Casă Oradea',loc:'Oradea',km:95}
];
/* ---------- STATE ---------- */
const DEF={tab:'acasa',sub:null,role:'cumparator',adsOn:true,adInterval:6,badges:{dor:'SPONSOR',serv:'PARTENER'},favP:[],favPr:[],cart:{},history:[],
 reviews:{p1:[{u:'Ana M.',r:5,t:'Roșii ca la piața din copilărie!',rep:[]}],p2:[{u:'Ioan P.',r:5,t:'Cartofi excelenți, livrare rapidă.',rep:[]}],p5:[{u:'Maria D.',r:4,t:'Miere foarte bună.',rep:[]}]}};
let state;
try{state=Object.assign({},DEF,JSON.parse(localStorage.getItem('aprozar_v2')||'{}'));}catch(e){state=JSON.parse(JSON.stringify(DEF));}
function save(){localStorage.setItem('aprozar_v2',JSON.stringify(state));}
let adIdx=0, openHist=null;
/* ---------- HELPERS ---------- */
const $=s=>document.querySelector(s);
const lei=v=>v.toFixed(2).replace('.',',')+' lei';
const prod=id=>PRODUCTS.find(p=>p.id===id);
const ferm=id=>PRODUCERS.find(p=>p.id===id);
function cartTotal(){let t=0;for(const id in state.cart){t+=state.cart[id]*prod(id).price;}return t;}
function cartCount(){let n=0;for(const id in state.cart)n++;return n;}
function addQty(id,d){const st=prod(id).unit==='kg'?0.5:1;state.cart[id]=Math.max(0,(state.cart[id]||0)+d*st);if(state.cart[id]<=0)delete state.cart[id];save();render();}
function toggleFavP(id){const i=state.favP.indexOf(id);i<0?state.favP.push(id):state.favP.splice(i,1);save();render();}
function toggleFavPr(id){const i=state.favPr.indexOf(id);i<0?state.favPr.push(id):state.favPr.splice(i,1);save();render();}
function go(tab,sub){state.tab=tab;state.sub=sub||null;openHist=null;save();render();window.scrollTo(0,0);}
/* ---------- ADS ---------- */
const ADS=[
 {id:'dor',title:'Dor de Casă',sub:'Lanțul de magazine Călin Donca · 300+ magazine în toată România.',b1:'Cel mai apropiat magazin',b2:'Toate magazinele'},
 {id:'serv',title:'Servicii Locale',sub:'Electricieni, instalatori, zugravi — verificați, lângă tine.',b1:'Vezi meseriașii',b2:''}
];
function adHTML(){
 if(!state.adsOn)return'';
 const a=ADS[adIdx%ADS.length];
 const badge=state.badges[a.id]||'';
 return `<div class="adbar">
   ${badge?`<span class="badge">${badge}</span>`:''}
   <h3>${a.title}</h3><p>${a.sub}</p>
   <div class="btns">
     <button class="btn y" onclick="${a.id==='dor'?`go('acasa',{t:'stores'})`:`window.open('https://serviciilocale.netlify.app/')`}">${a.b1}</button>
     ${a.b2?`<button class="btn g" onclick="go('acasa',{t:'stores'})">${a.b2}</button>`:''}
   </div></div>`;
}
setInterval(()=>{adIdx++;const el=$('#adslot');if(el)el.outerHTML=`<div id="adslot">${adHTML()}</div>`;},Math.max(3,state.adInterval)*1000);
/* ---------- COMPONENTE ---------- */
function headerHTML(){return `<header><img class="logoimg" src="logo.png" alt="" onerror="this.style.display='none'"><div class="logo">APROZAR ROMÂNESC</div></header>`;}
function searchHTML(){return `<div class="searchbox"><input id="q" placeholder="Produse, producători sau ferme..." oninput="onSearch(this.value)" onkeydown="if(event.key==='Enter'){go('acasa',{t:'rez',q:this.value})}"><div class="sugg" id="sugg" style="display:none"></div></div>`;}
function onSearch(v){
 const s=$('#sugg');if(!s)return;
 if(!v){s.style.display='none';return;}
 const q=v.toLowerCase();
 const pr=PRODUCTS.filter(p=>p.name.toLowerCase().includes(q)).slice(0,4);
 const fe=PRODUCERS.filter(p=>p.name.toLowerCase().includes(q)).slice(0,3);
 if(!pr.length&&!fe.length){s.style.display='none';return;}
 s.style.display='block';
 s.innerHTML=pr.map(p=>`<div onclick="go('acasa',{t:'produs',id:'${p.id}'})">${p.img} ${p.name} · <small>${lei(p.price)}/${p.unit}</small></div>`).join('')+
   fe.map(f=>`<div onclick="go('acasa',{t:'ferma',id:'${f.id}'})">${f.av} ${f.name} · <small>${f.loc}</small></div>`).join('');
}
function catsHTML(sel){return `<div class="cats"><span class="${(!sel||sel==='Toate')?'on':''}" onclick="go('acasa',{t:'rez',cat:'Toate'})">Toate</span>${CATS.map(c=>`<span class="${sel===c?'on':''}" onclick="go('acasa',{t:'rez',cat:'${c}'})">${c}</span>`).join('')}</div>`;}
function pcardHTML(f){return `<div class="pcard" onclick="go('acasa',{t:'ferma',id:'${f.id}'})">
  <button class="heart" onclick="event.stopPropagation();toggleFavP('${f.id}')">${state.favP.includes(f.id)?'❤️':'🤍'}</button>
  <div class="cover" style="background:${f.cover}">${f.av}</div>
  <div class="pav">${f.av}</div>
  <div class="body"><h4>${f.verified?'✅ ':''}${f.name}</h4><div class="meta">${f.loc}</div>
  <div class="stars">★ ${f.rating} (${f.rev}) · 📍 ${f.km} km</div></div></div>`;}
function prodrowHTML(p,quick){const q=state.cart[p.id]||0;return `<div class="prodrow" ${quick?'':`onclick="go('acasa',{t:'produs',id:'${p.id}'})"`}>
  ${p.season?'<span class="season">ÎN SEZON</span>':''}
  <button class="heart" onclick="event.stopPropagation();toggleFavPr('${p.id}')">${state.favPr.includes(p.id)?'❤️':'🤍'}</button>
  <div class="img">${p.img}</div>
  <div class="info"><b>${p.name}</b><small>${ferm(p.p).name}</small></div>
  <div class="right"><div class="price">${lei(p.price)}/${p.unit}</div>
  <div class="qty"><button onclick="event.stopPropagation();addQty('${p.id}',-1)">−</button><span>${q?q+(p.unit==='kg'?' kg':' buc'):''}</span><button onclick="event.stopPropagation();addQty('${p.id}',1)">+</button></div></div></div>`;}
function stickyHTML(){const t=cartTotal();if(t<=0)return'';return `<div class="sticky-total" onclick="go('cos')"><span>🛒 ${cartCount()} produse</span><span>Total: ${lei(t)} → Vezi coșul</span></div>`;}
function adSlot(){return `<div id="adslot">${adHTML()}</div>`;}
/* ---------- VIEWS ---------- */
function vAcasa(){
 const last=state.history[0];
 const quick=last?last.items.map(i=>prod(i.id)).filter(Boolean):PRODUCTS.filter(p=>p.season).slice(0,4);
 return adSlot()+searchHTML()+catsHTML()+`
 <div class="card" style="display:flex;justify-content:space-between;align-items:center"><div><b>Ești producător?</b><br><small style="color:var(--mut)">Vinde direct către clienți.</small></div><button class="btn g" onclick="alert('Înscrierea producătorilor: pasul următor!')">+ Adaugă produs</button></div>
 <h2 class="sec">Producători apropiați <a onclick="go('acasa',{t:'ferme'})">Vezi toți ›</a></h2>
 <div class="hscroll">${PRODUCERS.slice().sort((a,b)=>a.km-b.km).map(pcardHTML).join('')}</div>
 <h2 class="sec">Ultimele cumpărături <a onclick="go('cont')">Istoric ›</a></h2>
 <p style="font-size:.7rem;color:var(--mut);margin-bottom:4px">${last?'Reia rapid din comanda din '+last.date:'Produse de sezon, aproape de tine'}:</p>
 ${quick.map(p=>prodrowHTML(p,true)).join('')}
 <h2 class="sec">Poveștile fermierilor <a>Vezi toate ›</a></h2>
 <div class="hscroll">${STORIES.map(s=>`<div class="story" onclick="go('acasa',{t:'ferma',id:'${s.p}'})"><small>${ferm(s.p).name}</small><b>${s.t}</b><br><small>${s.txt}</small></div>`).join('')}</div>`;
}
function vRez(sub){
 let list=PRODUCTS.slice();
 if(sub.cat&&sub.cat!=='Toate')list=list.filter(p=>p.cat===sub.cat);
 if(sub.q){const q=sub.q.toLowerCase();list=list.filter(p=>p.name.toLowerCase().includes(q)||ferm(p.p).name.toLowerCase().includes(q));}
 return adSlot()+searchHTML()+catsHTML(sub.cat)+`<h2 class="sec">Rezultate (${list.length})</h2>`+(list.length?list.map(p=>prodrowHTML(p)).join(''):`<div class="empty">Nimic găsit.</div>`);}
function vFerme(){return adSlot()+`<h2 class="sec">Toți producătorii (după distanță)</h2><div class="hscroll">${PRODUCERS.slice().sort((a,b)=>a.km-b.km).map(pcardHTML).join('')}</div>`;}
function vFerma(id){const f=ferm(id);const revs=state.reviews[id]||[];
 return adSlot()+`<div class="cover-big" style="background:${f.cover}">${f.av}</div><div class="av-big">${f.av}</div>
 <div style="padding:0 14px"><h2 style="margin:6px 0">${f.verified?'✅ ':''}${f.name} <button class="heart" style="position:static" onclick="toggleFavP('${f.id}')">${state.favP.includes(f.id)?'❤️':'🤍'}</button></h2>
 <div style="color:var(--mut);font-size:.8rem">${f.loc} · 📍 ${f.km} km · <span class="stars">★ ${f.rating} (${f.rev} recenzii)</span></div></div>
 ${f.anunt?`<div class="anunt" style="margin:10px 14px">📢 ${f.anunt}</div>`:''}
 <div style="padding:0 12px">${PRODUCTS.filter(p=>p.p===id).map(p=>prodrowHTML(p)).join('')||'<div class="empty">Niciun produs.</div>'}
 <h2 class="sec">Recenzii ${state.role==='cumparator'?`<a onclick="addReview('${id}')">+ Lasă un review</a>`:''}</h2>
 ${revs.map((r,i)=>`<div class="rev">★ ${r.r} · <b>${r.u}</b><br>${r.t}
   ${r.rep.map(x=>`<div class="rep">↩ <b>${x.by}:</b> ${x.t}</div>`).join('')}
   ${(state.role==='producator'||state.role==='admin')?`<a style="color:var(--g2);font-size:.7rem;cursor:pointer" onclick="replyReview('${id}',${i})">Răspunde</a>`:''}</div>`).join('')||'<div class="empty">Fără recenzii încă.</div>'}</div>`;}
function addReview(id){const u=prompt('Numele tău:');if(!u)return;const r=prompt('Nota (1-5):','5');const t=prompt('Review-ul tău:');if(!t)return;(state.reviews[id]=state.reviews[id]||[]).unshift({u,r:Math.max(1,Math.min(5,+r||5)),t,rep:[]});save();render();}
function replyReview(id,i){const t=prompt('Răspunsul tău (ca producător):');if(!t)return;(state.reviews[id][i].rep).push({by:'Răspuns producător',t});save();render();}
function vProdus(id){const p=prod(id);const q=state.cart[id]||0;const same=PRODUCTS.filter(x=>x.p===p.p&&x.id!==id);
 return adSlot()+`<div class="cover-big" style="background:var(--gl)">${p.img}</div>
 <div style="padding:10px 14px"><small style="color:var(--mut)">Produse / ${p.cat}</small><h2>${p.name}</h2>
 <div style="color:var(--g2);font-size:.85rem;margin:4px 0;cursor:pointer" onclick="go('acasa',{t:'ferma',id:'${p.p}'})">${ferm(p.p).name} · ${ferm(p.p).loc}</div>
 <p style="font-size:.8rem;color:var(--mut)">${p.desc}</p>
 <div style="font-weight:900;font-size:1.1rem;margin:8px 0">${lei(p.price)} / ${p.unit}</div>
 <div class="qty" style="justify-content:flex-start"><button onclick="addQty('${p.id}',-1)">−</button><span>${q?q+(p.unit==='kg'?' kg':' buc'):'0'}</span><button onclick="addQty('${p.id}',1)">+</button></div>
 <div style="font-size:.8rem;margin:6px 0">Total: <b>${lei(q*p.price)}</b></div>
 <button class="btn g" style="width:100%;border-radius:12px;padding:12px" onclick="addQty('${p.id}',1)">Adaugă în coș</button>
 <button class="heart" style="position:static;margin-top:8px" onclick="toggleFavPr('${p.id}')">${state.favPr.includes(p.id)?'❤️ La favorite':'🤍 Adaugă la favorite'}</button>
 ${same.length?`<h2 class="sec">De la același loc</h2>`+same.map(x=>prodrowHTML(x)).join(''):''}</div>`;}
function vStores(){const s=STORES.slice().sort((a,b)=>a.km-b.km);
 return adSlot()+`<div class="card"><h2>🏪 Cel mai apropiat magazin</h2><p style="font-size:.9rem;font-weight:800;color:var(--g)">${s[0].name}</p><small style="color:var(--mut)">${s[0].loc} · 📍 ${s[0].km} km</small></div>
 <h2 class="sec">Toate magazinele (după distanță)</h2>${s.map(x=>`<div class="prodrow"><div class="img">🏪</div><div class="info"><b>${x.name}</b><small>${x.loc}</small></div><div class="right"><b>${x.km} km</b></div></div>`).join('')}`;}
function vCos(){const ids=Object.keys(state.cart);
 if(!ids.length)return adSlot()+`<div class="empty">Coșul e gol. 🧺<br><button class="btn g" style="margin-top:10px" onclick="go('acasa')">Vezi produsele</button></div>`;
 return adSlot()+`<h2 class="sec">Coșul tău</h2>${ids.map(id=>prodrowHTML(prod(id),true)).join('')}
 <div class="card"><div style="display:flex;justify-content:space-between;font-weight:900"><span>Total</span><span>${lei(cartTotal())}</span></div>
 <button class="btn g" style="width:100%;margin-top:10px;border-radius:12px;padding:12px" onclick="checkout()">✅ Finalizează comanda</button>
 <button class="btn o" style="width:100%;margin-top:8px;border-radius:12px" onclick="waOrder()">📲 Trimite pe WhatsApp</button></div>`;}
function checkout(){const items=Object.keys(state.cart).map(id=>({id,qty:state.cart[id],price:prod(id).price}));
 state.history.unshift({id:Date.now(),date:new Date().toLocaleDateString('ro-RO'),items,total:cartTotal()});
 state.cart={};save();go('cont');alert('✅ Comanda a fost înregistrată în istoric!');}
function waOrder(){let txt='Comandă Aprozar Românesc:%0A';for(const id in state.cart){txt+=`- ${prod(id).name} x${state.cart[id]} ${prod(id).unit} = ${lei(state.cart[id]*prod(id).price)}%0A`;}txt+=`Total: ${lei(cartTotal())}`;window.open('https://wa.me/40770148119?text='+txt);}
function vFav(){const fp=state.favP.map(ferm),fr=state.favPr.map(prod);
 return adSlot()+`<h2 class="sec">❤️ Producători favoriți</h2>${fp.length?`<div class="hscroll">${fp.map(pcardHTML).join('')}</div>`:'<div class="empty">Niciun producător favorit.</div>'}
 <h2 class="sec">❤️ Produse favorite</h2>${fr.length?fr.map(p=>prodrowHTML(p)).join(''):'<div class="empty">Niciun produs favorit.</div>'}`;}
function vMesaje(){return adSlot()+`<div class="card"><b>💬 Mesaje</b><p style="font-size:.8rem;color:var(--mut);margin-top:6px">Conversațiile cumpărător ↔ producător vin în pasul următor (Panou Producător).</p></div>`;}
function vCont(){
 return adSlot()+`
 <div class="card"><b>👤 Cont & rol (demo)</b>
 <div style="display:flex;gap:8px;margin-top:8px">
 ${['cumparator','producator','admin'].map(r=>`<button class="btn ${state.role===r?'g':'o'}" onclick="state.role='${r}';save();render()">${r}</button>`).join('')}</div></div>
 ${state.role==='admin'?adminHTML():''}
 <h2 class="sec">🧾 Istoric comenzi</h2>
 ${state.history.length?state.history.map((h,i)=>`<div class="hist"><div class="row" onclick="openHist=openHist===${i}?null:${i};render()">
   <span class="date">📅 ${h.date}</span><span class="sum">${lei(h.total)}</span><span>${openHist===i?'▲':'▼'}</span></div>
   ${openHist===i?`<div class="det">${h.items.map(it=>`<div style="display:flex;justify-content:space-between"><span>${prod(it.id)?prod(it.id).name:'?'} x${it.qty}</span><b>${lei(it.qty*it.price)}</b></div>`).join('')}
   <button class="btn g" style="width:100%;margin-top:8px" onclick="rebuy(${i})">🔁 Cumpără din nou</button></div>`:''}</div>`).join(''):'<div class="empty">Nicio comandă încă.</div>'}
 <div class="card"><b>⚙️ Setări reclame</b>
   <div class="field"><label>Interval rotire (secunde)</label><input type="number" value="${state.adInterval}" onchange="state.adInterval=Math.max(3,+this.value||6);save()"></div>
   <div class="field"><label>Reclame active</label><select onchange="state.adsOn=this.value==='da';save();render()"><option value="da" ${state.adsOn?'selected':''}>da</option><option value="nu" ${!state.adsOn?'selected':''}>nu</option></select></div></div>`;}
function adminHTML(){return `<div class="card"><b>🛠️ Admin — etichete reclame</b>
 ${Object.keys(state.badges).map(k=>`<div class="field"><label>${k==='dor'?'Dor de Casă':'Servicii Locale'} (badge dreapta-sus)</label><input value="${state.badges[k]}" onchange="state.badges['${k}']=this.value;save();render()"></div>`).join('')}</div>`;}
function rebuy(i){const h=state.history[i];h.items.forEach(it=>{state.cart[it.id]=(state.cart[it.id]||0)+it.qty;});save();go('cos');}
/* ---------- RENDER ---------- */
function render(){
 const sub=state.sub;let html='';
 if(state.tab==='acasa'){
   if(sub&&sub.t==='rez')html=vRez(sub);
   else if(sub&&sub.t==='ferme')html=vFerme();
   else if(sub&&sub.t==='ferma')html=vFerma(sub.id);
   else if(sub&&sub.t==='produs')html=vProdus(sub.id);
   else if(sub&&sub.t==='stores')html=vStores();
   else html=vAcasa();
 }
 else if(state.tab==='cos')html=vCos();
 else if(state.tab==='favorite')html=vFav();
 else if(state.tab==='mesaje')html=vMesaje();
 else html=vCont();
 $('#app').innerHTML=headerHTML()+(state.tab!=='acasa'||!sub?stickyHTML():'')+html;
 $('#nav').innerHTML=[['acasa','🏠','Acasă'],['mesaje','💬','Mesaje'],['favorite','❤️','Favorite'],['cos','🛒','Coș'],['cont','👤','Cont']].map(n=>`<a class="${state.tab===n[0]?'on':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</a>`).join('');
}
render();
</script>
</body>
</html>
